name: CI

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: '1.26'

# Every action and tool below is pinned to a commit or a released version. A
# tag can be moved, so a compromised upstream account would otherwise reach
# this build, and SECURITY.md puts that in scope.
jobs:
  go:
    runs-on: ubuntu-latest
    # The tests run against a real PostgreSQL rather than skipping without one.
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: sucopay
          POSTGRES_PASSWORD: sucopay
          POSTGRES_DB: sucopay
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sucopay"
          --health-interval 5s
          --health-retries 10
    env:
      SUCO_TEST_DATABASE_URL: postgres://sucopay:sucopay@127.0.0.1:5432/sucopay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '${{ env.GO_VERSION }}', cache: true }
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '${{ env.GO_VERSION }}', cache: true }
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0

  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '${{ env.GO_VERSION }}', cache: true }
      - run: make vuln

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '${{ env.GO_VERSION }}', cache: true }
      # Short, because this runs on every change. The seed corpus runs with the
      # ordinary tests; this is the search for what is not in it yet.
      - run: make fuzz FUZZTIME=30s

  repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '${{ env.GO_VERSION }}', cache: true }
      - run: make repo
