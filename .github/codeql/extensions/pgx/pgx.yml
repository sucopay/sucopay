# Where SQL reaches the database. codeql/go-all models database/sql and the
# ORMs, and nothing of github.com/jackc/pgx/v5, so without this CodeQL does
# not see any statement suco runs reach the database at all.
#
# Every method that runs SQL takes it as the argument after ctx, apart from
# the ones that have no ctx and the ones that take a statement name first.
extensions:
  - addsTo:
      pack: codeql/go-all
      extensible: sinkModel
    data:
      - ["github.com/jackc/pgx/v5", "Conn", true, "Exec", "", "", "Argument[1]", "sql-injection", "manual"]
      - ["github.com/jackc/pgx/v5", "Conn", true, "Query", "", "", "Argument[1]", "sql-injection", "manual"]
      - ["github.com/jackc/pgx/v5", "Conn", true, "QueryRow", "", "", "Argument[1]", "sql-injection", "manual"]
      - ["github.com/jackc/pgx/v5", "Conn", true, "Prepare", "", "", "Argument[2]", "sql-injection", "manual"]
      - ["github.com/jackc/pgx/v5", "Tx", true, "Exec", "", "", "Argument[1]", "sql-injection", "manual"]
      - ["github.com/jackc/pgx/v5", "Tx", true, "Query", "", "", "Argument[1]", "sql-injection", "manual"]
      - ["github.com/jackc/pgx/v5", "Tx", true, "QueryRow", "", "", "Argument[1]", "sql-injection", "manual"]
      - ["github.com/jackc/pgx/v5", "Tx", true, "Prepare", "", "", "Argument[2]", "sql-injection", "manual"]
      - ["github.com/jackc/pgx/v5", "Batch", true, "Queue", "", "", "Argument[0]", "sql-injection", "manual"]
      - ["github.com/jackc/pgx/v5/pgxpool", "Pool", true, "Exec", "", "", "Argument[1]", "sql-injection", "manual"]
      - ["github.com/jackc/pgx/v5/pgxpool", "Pool", true, "Query", "", "", "Argument[1]", "sql-injection", "manual"]
      - ["github.com/jackc/pgx/v5/pgxpool", "Pool", true, "QueryRow", "", "", "Argument[1]", "sql-injection", "manual"]
      - ["github.com/jackc/pgx/v5/pgxpool", "Conn", true, "Exec", "", "", "Argument[1]", "sql-injection", "manual"]
      - ["github.com/jackc/pgx/v5/pgxpool", "Conn", true, "Query", "", "", "Argument[1]", "sql-injection", "manual"]
      - ["github.com/jackc/pgx/v5/pgxpool", "Conn", true, "QueryRow", "", "", "Argument[1]", "sql-injection", "manual"]
      - ["github.com/jackc/pgx/v5/pgxpool", "Tx", true, "Exec", "", "", "Argument[1]", "sql-injection", "manual"]
      - ["github.com/jackc/pgx/v5/pgxpool", "Tx", true, "Query", "", "", "Argument[1]", "sql-injection", "manual"]
      - ["github.com/jackc/pgx/v5/pgxpool", "Tx", true, "QueryRow", "", "", "Argument[1]", "sql-injection", "manual"]
      - ["github.com/jackc/pgx/v5/pgxpool", "Tx", true, "Prepare", "", "", "Argument[2]", "sql-injection", "manual"]
      - ["github.com/jackc/pgx/v5/pgconn", "PgConn", true, "Exec", "", "", "Argument[1]", "sql-injection", "manual"]
      - ["github.com/jackc/pgx/v5/pgconn", "PgConn", true, "ExecParams", "", "", "Argument[1]", "sql-injection", "manual"]
      - ["github.com/jackc/pgx/v5/pgconn", "PgConn", true, "Prepare", "", "", "Argument[2]", "sql-injection", "manual"]
      - ["github.com/jackc/pgx/v5/pgconn", "PgConn", true, "CopyFrom", "", "", "Argument[2]", "sql-injection", "manual"]
      - ["github.com/jackc/pgx/v5/pgconn", "PgConn", true, "CopyTo", "", "", "Argument[2]", "sql-injection", "manual"]
      - ["github.com/jackc/pgx/v5/pgconn", "Batch", true, "ExecParams", "", "", "Argument[0]", "sql-injection", "manual"]
      - ["github.com/jackc/pgx/v5/pgconn", "Pipeline", true, "SendPrepare", "", "", "Argument[1]", "sql-injection", "manual"]
      - ["github.com/jackc/pgx/v5/pgconn", "Pipeline", true, "SendQueryParams", "", "", "Argument[0]", "sql-injection", "manual"]
