version: "2"

linters:
  default: standard
  enable:
    - revive

  settings:
    revive:
      rules:
        # CONTRIBUTING.md requires a doc comment on every exported name.
        - name: exported
        - name: package-comments
        - name: error-strings
        - name: indent-error-flow
        - name: unreachable-code

    errcheck:
      # A failed write to a terminal leaves nothing to do, and a handler that
      # fails mid-body has already sent its status line. Every other unchecked
      # error stays a finding.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

  exclusions:
    rules:
      - path: _test\.go$
        linters:
          # Tests report failures through t.Fatal; a deferred Close in a test
          # has nothing to report to.
          - errcheck
          - revive
