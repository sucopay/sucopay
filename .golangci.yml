version: "2"

linters:
  default: standard
  enable:
    - revive

  settings:
    revive:
      rules:
        # CONTRIBUTING.md requires a doc comment on every exported name.
        - name: exported
        - name: package-comments
        - name: error-strings
        - name: indent-error-flow
        - name: unreachable-code

    errcheck:
      # A failed write to a terminal leaves nothing to do, and a handler that
      # fails mid-body has already sent its status line. Every other unchecked
      # error stays a finding.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*text/tabwriter.Writer).Flush

  exclusions:
    rules:
      - path: _test\.go$
        linters:
          # Tests report failures through t.Fatal, so a deferred Close has
          # nothing to report to, and a test helper is not part of any
          # package's documented surface.
          - errcheck
          - revive
