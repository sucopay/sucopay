version: "2"

linters:
  default: standard
  enable:
    - revive
    - nolintlint
    # The rule about t.Parallel is in CONTRIBUTING; this is what keeps it from
    # depending on a reviewer noticing.
    - paralleltest
    # What a reader reviewing for security looks for first: SQL assembled
    # from text, a file every account on the host can read, a cipher that
    # has been broken. A reviewer reads a change once; this reads every one.
    #
    # A finding that is wrong at one line is silenced there with gosec's own
    # comment, `#nosec G304 -- why`, and not with nolint. nolint names the
    # linter, so it would also silence whatever every other rule here has to
    # say about that line, such as the mode a file is made with.
    - gosec

  settings:
    gosec:
      excludes:
        # An unhandled error is errcheck's, with the exclusions below. Read
        # here as well, the same calls are reported twice, under a rule that
        # cannot be told which functions are exempt.
        - G104

    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: error-strings
        - name: indent-error-flow
        - name: unreachable-code

    paralleltest:
      # Subtests are left to judgement. Some share a connection or a fixture
      # with the case beside them, and running those together would be a race
      # rather than a speedup.
      ignore-missing-subtests: true

    nolintlint:
      # A silencing comment has to say what it is silencing and why, or it
      # becomes the way findings get made to go away.
      require-explanation: true
      require-specific: true
      allow-unused: false

    errcheck:
      # `x, _ := f()` drops an error as thoroughly as ignoring the call, and it
      # is the form that actually gets written.
      check-blank: true
      # A bare `v := x.(T)` panics on the value the assertion did not expect,
      # and this code walks a document a stranger wrote.
      check-type-assertions: true

      # These write the CLI's own output to a terminal. A failed write there
      # leaves nothing to do and nowhere to report it. The exclusion goes by
      # function and not by destination, so keep them out of code that writes
      # anywhere else.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*text/tabwriter.Writer).Flush

  exclusions:
    rules:
      - path: cmd/suco/(main|credential|asset|payment|payments|doctor|network)_test\.go$
        linters:
          # The CLI reads the real environment, so its tests set one, and Go
          # refuses to run a test that does both.
          - paralleltest

      - path: _test\.go$
        linters:
          # Tests report failures through t.Fatal, so a deferred Close has
          # nothing to report to, and a test helper is not part of any
          # package's documented surface. What gosec reports in a test is
          # the test's own doing: a fixture written 0644, the line init
          # printed handed to sh, the database URL docker-compose.yml gives
          # it, password included. None of it ships.
          - errcheck
          - revive
          - gosec
