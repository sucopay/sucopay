# A PostgreSQL for working on suco Pay itself. Started by `make dev`, and the
# database the tests run against.
services:
  postgres:
    image: postgres:17-alpine
    # The suite runs packages beside each other and tests beside each other
    # inside them, each against a database of its own, so the connections it
    # holds at once are counted in hundreds. PostgreSQL ships a default of 100,
    # chosen for a server that does not know what is coming.
    command: ["postgres", "-c", "max_connections=400"]
    environment:
      POSTGRES_USER: sucopay
      POSTGRES_PASSWORD: sucopay
      POSTGRES_DB: sucopay
    # Bound to the loopback address: the password above is public, and
    # Docker publishes a port past the host firewall.
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sucopay"]
      interval: 5s
      retries: 10

  # suco:
  #   build: { context: ., dockerfile: deploy/docker/Dockerfile }
  #   command: serve
  #   ports: ["7826:7826"]
  #   depends_on:
  #     postgres: { condition: service_healthy }

volumes:
  pgdata:
